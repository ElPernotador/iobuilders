publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.2
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
